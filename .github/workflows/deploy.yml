name: Deploy HRIS to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hris-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy HRIS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy HRIS to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -e

            echo "=================================================="
            echo " HRIS CI/CD DEPLOYMENT"
            echo "=================================================="

            echo "[1] VERIFY USER"
            test "$(whoami)" = "hris-deploy"
            whoami

            echo "[2] RUN HRIS DEPLOYMENT"
            TARGET_COMMIT="${{ github.sha }}"
            echo "TARGET_COMMIT=${TARGET_COMMIT}"
            sudo -n /usr/local/sbin/hris-deploy "${TARGET_COMMIT}"

            echo "[3] DEPLOYMENT COMMAND FINISHED"

            echo "[4] HEALTH CHECK"
            # "/" redirects without touching the database, so it stays green
            # even when PostgreSQL is down. /api/health runs SELECT 1 and
            # answers 503 when the database is unreachable. Retry while the
            # service restarts.
            HTTP_STATUS=000
            for attempt in 1 2 3 4 5 6; do
              HTTP_STATUS="$(curl -sS \
                -o /dev/null \
                -w '%{http_code}' \
                --max-time 15 \
                http://127.0.0.1:3000/api/health || true)"
              echo "attempt ${attempt}: HTTP_STATUS=$HTTP_STATUS"
              [ "$HTTP_STATUS" = "200" ] && break
              sleep 5
            done

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "HRIS HEALTH CHECK: OK (app + database)"
            else
              echo "HRIS HEALTH CHECK: FAILED — app or database unavailable"
              echo "Check on the VPS: df -h; systemctl status postgresql; journalctl -u hris -n 100"
              exit 1
            fi

            echo
            echo "=================================================="
            echo " HRIS DEPLOYMENT SUCCESS"
            echo "=================================================="