# HRIS — systemd credential drop-in (Phase A)
#
# STATUS: TEMPLATE / NOT INSTALLED.
#   This file is a release artifact. Copying it into
#   /etc/systemd/system/hris.service.d/ is a PRODUCTION change and is part of
#   the credential-rotation change window, NOT part of the code-only phase.
#   Nothing in this repository install path touches the live unit.
#
# ---------------------------------------------------------------------------
# WHY
# ---------------------------------------------------------------------------
# The exposed secret lived in an EnvironmentFile:
#     EnvironmentFile=/opt/hris/.env.production     (mode 0640, hris:hris)
# Any process running as `hris` can read that file, and it holds plaintext for
# the lifetime of the credential. `LoadCredentialEncrypted=` moves the secret
# out of the environment and onto a per-service directory that systemd
# materialises immediately before ExecStart and tears down afterwards.
#
# Verified on this host (systemd 255) with a throwaway transient unit:
#   * the secret does NOT appear in /proc/<pid>/environ
#   * the secret is NOT in the command line (invisible to ps)
#   * $CREDENTIALS_DIRECTORY contains only a PATH
#   * the credential file is mode 0440 root:root, readable by the service user
#     through an ACL, and works with ProtectSystem=full + NoNewPrivileges=true
#
# ---------------------------------------------------------------------------
# CREDENTIAL IDS (must match lib/config/credentials.ts SECRET_SOURCES)
# ---------------------------------------------------------------------------
#   database_url                          -> DATABASE_URL
#   face_template_encryption_key          -> FACE_TEMPLATE_ENCRYPTION_KEY
#   face_template_encryption_key_previous -> FACE_TEMPLATE_ENCRYPTION_KEY_PREVIOUS
#
# The third one is only provisioned DURING a face-key rotation window. It is
# the decrypt-only fallback for templates still labelled with the old
# key_version. See docs/SECURITY-ROTATION-IMPLEMENTATION.md.
#
# ---------------------------------------------------------------------------
# NOTE ON EnvironmentFile=
# ---------------------------------------------------------------------------
# EnvironmentFile= is deliberately KEPT for the transition. Application code
# prefers the credential and falls back to the environment variable, so the two
# can coexist safely and the change is reversible by removing this drop-in.
#
# Removing the now-redacted lines from /opt/hris/.env.production is a SEPARATE,
# LATER step, to be done only after the rotation window has closed and the
# previous key has been withdrawn. It is not part of this drop-in.
#
# ---------------------------------------------------------------------------
# KNOWN LIMITATION (cannot be fixed by configuration)
# ---------------------------------------------------------------------------
# /var/lib/systemd/credential.secret is the systemd host key. On this host
# systemd reports it is "not located on encrypted media". The credstore is
# therefore only as protected as a root-only 0400 file: a root-level attacker
# can still recover the secret. This is strictly better than a world-adjacent
# plaintext env file, but it is not a substitute for a real secret store.
# Migrating to SOPS+age or Vault is the documented follow-up.

[Service]
LoadCredentialEncrypted=database_url:/etc/credstore/database_url.cred
LoadCredentialEncrypted=face_template_encryption_key:/etc/credstore/face_template_encryption_key.cred
